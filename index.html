<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tyrink — Private & Instant Text Links</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #151d30;
      --border: #263352;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --accent: #10b981;
      --code-bg: #090d16;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 760px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    header {
      text-align: center;
    }

    .logo {
      font-size: 2.5rem;
      font-weight: 800;
      background: linear-gradient(135deg, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.05em;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-top: 0.25rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
    }

    textarea {
      width: 100%;
      height: 120px;
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 0.75rem;
      font-size: 1rem;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s;
    }

    textarea:focus {
      border-color: var(--primary);
    }

    .btn-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1rem;
      gap: 1rem;
    }

    button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.75rem 1.4rem;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    button:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-copy {
      background: #334155;
    }

    .btn-copy:hover:not(:disabled) {
      background: #475569;
    }

    .status {
      font-size: 0.85rem;
      color: var(--text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .results {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .result-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .result-group label {
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .url-container {
      display: flex;
      gap: 0.5rem;
    }

    .url-box {
      flex-grow: 1;
      background: var(--code-bg);
      border: 1px solid var(--accent);
      color: var(--accent);
      border-radius: 8px;
      padding: 0.75rem;
      font-family: monospace;
      font-size: 0.9rem;
      word-break: break-all;
    }

    .decoded-box {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem;
      color: var(--text);
      font-size: 0.95rem;
      white-space: pre-wrap;
    }

    details {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem;
    }

    summary {
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .details-content {
      margin-top: 0.75rem;
      font-family: monospace;
      font-size: 0.8rem;
      max-height: 140px;
      overflow-y: auto;
      word-break: break-all;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="logo">Tyrink</div>
      <p>Compress & share text directly inside a link — 100% private with no database</p>
    </header>

    <!-- Decoded Hash Content Card (Automatically shows when someone opens a shared link) -->
    <div id="decodeSection" class="card results" style="display: none;">
      <div class="result-group">
        <label>Shared Message Found in Link</label>
        <div class="decoded-box" id="decodedText"></div>
      </div>
    </div>

    <!-- Create Short Link Card -->
    <div class="card">
      <textarea id="inputText" placeholder="Paste or type any text here to turn it into a shareable link..."></textarea>
      <div class="btn-row">
        <button id="shortenBtn" disabled>Starting Up...</button>
        <span id="statusText" class="status">Setting up compression engine...</span>
      </div>
    </div>

    <!-- Output Generated Link Card -->
    <div id="outputSection" class="card results" style="display: none;">
      <div class="result-group">
        <label>Your Shareable Link</label>
        <div class="url-container">
          <div class="url-box" id="shortUrl"></div>
          <button class="btn-copy" id="copyBtn">Copy Link</button>
        </div>
      </div>

      <details>
        <summary>Advanced Compression Stats</summary>
        <div class="details-content" id="debugContent"></div>
      </details>
    </div>
  </div>

  <!-- Priority Queue implementation for Huffman Tree -->
  <script>
    class MinHeap {
      constructor() { this.heap = []; }
      push(item) {
        this.heap.push(item);
        this._bubbleUp(this.heap.length - 1);
      }
      pop() {
        if (this.heap.length === 0) return null;
        const top = this.heap[0];
        const bottom = this.heap.pop();
        if (this.heap.length > 0) {
          this.heap[0] = bottom;
          this._bubbleDown(0);
        }
        return top;
      }
      size() { return this.heap.length; }
      _bubbleUp(i) {
        while (i > 0) {
          const p = Math.floor((i - 1) / 2);
          if (this._compare(this.heap[i], this.heap[p]) < 0) {
            [this.heap[i], this.heap[p]] = [this.heap[p], this.heap[i]];
            i = p;
          } else break;
        }
      }
      _bubbleDown(i) {
        const len = this.heap.length;
        while (true) {
          let smallest = i;
          const left = 2 * i + 1;
          const right = 2 * i + 2;
          if (left < len && this._compare(this.heap[left], this.heap[smallest]) < 0) smallest = left;
          if (right < len && this._compare(this.heap[right], this.heap[smallest]) < 0) smallest = right;
          if (smallest !== i) {
            [this.heap[i], this.heap[smallest]] = [this.heap[smallest], this.heap[i]];
            i = smallest;
          } else break;
        }
      }
      _compare(a, b) {
        if (a[0] !== b[0]) return a[0] - b[0];
        return a[1] - b[1];
      }
    }
  </script>

  <!-- Bit-Packing and Base64 Utilities -->
  <script>
    const CHARS = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_";

    function bitsToBase64(bitStr) {
      let padded = bitStr;
      const padLen = (6 - (padded.length % 6)) % 6;
      padded += "0".repeat(padLen);
      let out = "";
      for (let i = 0; i < padded.length; i += 6) {
        const chunk = padded.substring(i, i + 6);
        out += CHARS[parseInt(chunk, 2)];
      }
      return { encoded: out, padLen: padLen, originalBits: bitStr.length };
    }

    function base64ToBits(b64Str, padLen) {
      let bits = "";
      for (let i = 0; i < b64Str.length; i++) {
        const val = CHARS.indexOf(b64Str[i]);
        if (val === -1) continue;
        bits += val.toString(2).padStart(6, "0");
      }
      return padLen > 0 ? bits.slice(0, -padLen) : bits;
    }
  </script>

  <!-- Application Logic -->
  <script type="module">
    import { AutoTokenizer } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.2';

    const inputText = document.getElementById('inputText');
    const shortenBtn = document.getElementById('shortenBtn');
    const statusText = document.getElementById('statusText');
    const outputSection = document.getElementById('outputSection');
    const shortUrl = document.getElementById('shortUrl');
    const copyBtn = document.getElementById('copyBtn');
    const debugContent = document.getElementById('debugContent');
    const decodeSection = document.getElementById('decodeSection');
    const decodedText = document.getElementById('decodedText');

    let tokenizer = null;

    // 1. Initialize Smart Language Processor
    async function init() {
      try {
        tokenizer = await AutoTokenizer.from_pretrained('Xenova/gpt2');
        statusText.textContent = 'Ready to shorten text';
        shortenBtn.disabled = false;
        shortenBtn.textContent = 'Create Short Link';

        // Check if user arrived via a link with text in it
        handleIncomingHash();
      } catch (err) {
        statusText.textContent = 'Failed to load compression engine. Please refresh.';
        console.error(err);
      }
    }

    // 2. Encode to Tyrink URL
    shortenBtn.addEventListener('click', async () => {
      const text = inputText.value.trim();
      if (!text) return;

      const encoded = await tokenizer(text);
      const token_ids = Array.from(encoded.input_ids.data, (id) => Number(id));

      // Calculate frequencies
      const frequency = {};
      for (const id of token_ids) {
        frequency[id] = (frequency[id] || 0) + 1;
      }

      // Build Tree Structure
      const heap = new MinHeap();
      let order = 0;
      for (const [id, count] of Object.entries(frequency)) {
        heap.push([count, order++, Number(id)]);
      }

      while (heap.size() > 1) {
        const first = heap.pop();
        const second = heap.pop();
        heap.push([first[0] + second[0], order++, [first[2], second[2]]]);
      }

      const huffmanTree = heap.pop()[2];

      // Generate Codes
      const codes = {};
      function makeCodes(node, code = "") {
        if (typeof node === 'number') {
          codes[node] = code === "" ? "0" : code;
          return;
        }
        makeCodes(node[0], code + "0");
        makeCodes(node[1], code + "1");
      }
      makeCodes(huffmanTree);

      // Create compressed bitstream
      let bitstream = "";
      for (const id of token_ids) {
        bitstream += codes[id];
      }

      // Package everything into URL-friendly text
      const packedData = bitsToBase64(bitstream);
      const payload = {
        t: huffmanTree,
        p: packedData.padLen,
        d: packedData.encoded
      };

      const base64Hash = btoa(JSON.stringify(payload))
        .replace(/\+/g, '-')
        .replace(/\//g, '_')
        .replace(/=+$/, '');

      const domain = `${window.location.origin}${window.location.pathname}`;
      const finalUrl = `${domain}#${base64Hash}`;

      shortUrl.textContent = finalUrl;
      outputSection.style.display = 'flex';

      debugContent.innerHTML = `
        <strong>Original Text Length:</strong> ${text.length} characters<br/>
        <strong>Link Payload Size:</strong> ${base64Hash.length} characters<br/>
        <strong>Compressed Size:</strong> ${packedData.originalBits} bits<br/>
        <strong>Word Units Processed:</strong> ${token_ids.length}
      `;
    });

    // 3. Decode incoming URL Link
    async function handleIncomingHash() {
      const hash = window.location.hash.replace(/^#/, '');
      if (!hash) return;

      try {
        statusText.textContent = 'Unpacking shared message...';
        
        let b64 = hash.replace(/-/g, '+').replace(/_/g, '/');
        while (b64.length % 4 !== 0) b64 += '=';

        const payload = JSON.parse(atob(b64));
        const { t: tree, p: padLen, d: encodedStr } = payload;

        const bits = base64ToBits(encodedStr, padLen);

        // Decode bitstream
        const decodedTokenIds = [];
        let curr = tree;

        if (typeof curr === 'number') {
          for (let i = 0; i < bits.length; i++) decodedTokenIds.push(curr);
        } else {
          for (let i = 0; i < bits.length; i++) {
            const bit = bits[i];
            curr = (bit === '0') ? curr[0] : curr[1];

            if (typeof curr === 'number') {
              decodedTokenIds.push(curr);
              curr = tree;
            }
          }
        }

        // Convert back to original text
        const reconstructedText = await tokenizer.decode(decodedTokenIds, { skip_special_tokens: true });

        decodedText.textContent = reconstructedText;
        decodeSection.style.display = 'flex';
        statusText.textContent = 'Message loaded from link';
      } catch (err) {
        console.error("Failed to decode message:", err);
        statusText.textContent = 'Could not load message (link might be incomplete or broken).';
      }
    }

    window.addEventListener('hashchange', handleIncomingHash);

    // 4. Copy URL helper
    copyBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(shortUrl.textContent);
      copyBtn.textContent = 'Copied!';
      setTimeout(() => copyBtn.textContent = 'Copy Link', 2000);
    });

    init();
  </script>
</body>
</html>
